<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b0d13;
}
.window {
  width: 1100px;
  min-height: 190px;
  background: #0b0d13;
  border-radius: 8px;
  overflow: hidden;
  font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
  color: #e6e6e6;
  font-size: 14px;
  line-height: 21px;
}
.titlebar {
  height: 32px;
  background: #1a1d26;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 6px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.red { background: #ff5f56; }
.yellow { background: #ffbd2e; }
.green { background: #27c93f; }
.titlebar-title {
  margin-left: 8px;
  font-size: 12px;
  color: #8b92a8;
  line-height: 32px;
}
.content {
  padding: 16px;
  white-space: pre-wrap;
  word-break: break-word;
}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
    <span class="titlebar-title">FacturacionAr.Cli --mock</span>
  </div>
  <div class="content">Facturación electrónica Argentina - modo simulado (mock)
Mock URL: http://127.0.0.1:58340/
Resultado: A
CAE ficticio: 123456182727
Vencimiento CAE: 2026-11-21
Observación 100: Mock: factura C emitida en modo simulado.</div>
</div>
</body>
</html>
